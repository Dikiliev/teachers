server {
    listen 80;
    server_name xexarxo.ru;

    location / {
        # Можете пока оставить редирект закомментирован
        # return 301 https://$host$request_uri;
        # или отдавать тестовую страницу, лишь бы порт 80 работал
        return 200 'Temporary page';
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

